<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Línea del Tiempo Musical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: una columna estrecha tipo app de bolsillo; la línea de tiempo es una pila vertical de cartas con ranuras entre ellas. Tema "neón de club": fondo casi negro, acentos lima/rosa/cian, brillo solo en lo importante. */
:root{
  --bg:#0b0b10; --surface:#15151f; --line:#2a2a3a; --fg:#f2f2f7; --muted:#a9a9bc; --ink:#0b0b10;
  --accent:#ff3fa4; --gold:#c6ff3d; --cyan:#3de8ff; --ok:#3dffb0; --bad:#ff6b4a;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;
  --body:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2rem;color:var(--gold);text-shadow:0 0 18px color-mix(in oklab,var(--gold) 50%,transparent)}
h2{font-size:1.4rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--bg);background:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--accent);color:var(--ink);box-shadow:0 0 22px color-mix(in oklab,var(--accent) 45%,transparent)}
.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.gold{background:var(--gold);color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px}
.prow input{flex:1}
.prow button{min-height:auto;padding:0 14px;flex:0 0 auto}
/* marcador */
.score{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:0 0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.82rem;display:flex;gap:8px;align-items:center;white-space:nowrap}
.chip.on{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 18%,var(--surface))}
.chip b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tok{display:inline-flex;gap:3px}
.tok i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block}
/* vinilo / DJ */
.dj{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.vinyl{width:96px;height:96px;border-radius:50%;background:repeating-radial-gradient(circle at center,#000 0 2px,#17171f 2px 4px);position:relative;box-shadow:0 0 0 2px var(--line),0 0 26px color-mix(in oklab,var(--accent) 35%,transparent)}
.vinyl::after{content:"?";position:absolute;inset:32px;border-radius:50%;background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.4rem;display:grid;place-items:center}
.spin .vinyl{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin .vinyl{animation:none}}
/* línea de tiempo */
.tl{display:flex;flex-direction:column;gap:6px}
.card{--c:var(--cyan);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;color:var(--fg);background:var(--surface);border:1px solid color-mix(in oklab,var(--c) 40%,var(--line))}
.card .yr{font-family:var(--mono);font-size:1.6rem;color:var(--c);text-shadow:0 0 12px color-mix(in oklab,var(--c) 60%,transparent);grid-row:span 2;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.card .t{font-weight:700;line-height:1.2;min-width:0}
.card .a{font-size:.85rem;color:var(--muted);min-width:0}
.card.new{outline:3px solid var(--fg);outline-offset:2px}
.mystery{background:repeating-linear-gradient(135deg,var(--accent) 0 12px,#e62e8f 12px 24px);color:var(--ink);border-radius:16px;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:1.2rem;text-align:center}
.mystery.steal{background:repeating-linear-gradient(135deg,var(--gold) 0 12px,#a8e021 12px 24px);color:var(--ink)}
.slot{min-height:40px;padding:8px 12px;border-radius:12px;background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;font-size:.9rem;width:100%}
.slot:hover{border-color:var(--gold);color:var(--gold)}
.slot.blocked{opacity:.3;pointer-events:none}
/* revelado */
.reveal{--c:var(--cyan);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px;color:var(--fg);background:var(--surface);border:1.5px solid var(--c);box-shadow:0 0 30px color-mix(in oklab,var(--c) 30%,transparent);animation:pop .45s ease-out}
.reveal .yr{font-family:var(--mono);font-size:3.6rem;color:var(--c);text-shadow:0 0 20px color-mix(in oklab,var(--c) 65%,transparent);line-height:1;letter-spacing:-.04em}
.reveal .t{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
@keyframes pop{from{transform:rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.verdict{font-family:var(--display);font-weight:800;font-size:1.35rem}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.steals{display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-weight:700}
details ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot button{min-height:40px;padding:8px 14px;font-size:.85rem}
.podium{display:flex;flex-direction:column;gap:8px}
.podium div{display:flex;justify-content:space-between;background:var(--surface);border-radius:12px;padding:12px 16px}
.podium b{font-family:var(--mono)}
.banner{background:color-mix(in oklab,var(--gold) 16%,var(--surface));border:1px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:.9rem}
.you{background:var(--gold);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:.7rem;font-weight:700}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.code{font-family:var(--mono);color:var(--fg);letter-spacing:.08em;font-size:.95rem}
.live{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.live.on{color:var(--ok);border-color:var(--ok)}
.live.error{color:var(--bad);border-color:var(--bad)}
.hero{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.invite{align-items:center;text-align:center}
.qr{background:#f2f2f7;padding:10px;border-radius:14px;line-height:0;min-height:20px}
.qr img,.qr canvas{display:block}
.sel{user-select:all;word-break:break-all;font-family:var(--mono);font-size:.85rem}
.guess{display:flex;flex-direction:column;gap:8px}
.guess div{border-radius:12px;padding:10px 12px;border:1px solid var(--line);overflow-wrap:anywhere}
.guess span{font-weight:800;margin-right:6px}
.guess .hit{border-color:var(--ok);color:var(--ok)}
.guess .miss{border-color:var(--bad);color:var(--fg)}
.guess .miss span{color:var(--bad)}
.timer{position:relative;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.timer .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in oklab,var(--gold) 35%,transparent);width:100%;transition:width .25s linear}
.timer.low .bar{background:color-mix(in oklab,var(--bad) 45%,transparent)}
.timer span{position:relative;font-family:var(--mono);font-weight:700;font-size:1.1rem}
.big{font-size:1.2rem;min-height:64px;width:100%}
.mic{flex:0 0 auto;min-height:0;width:52px;padding:0}
.mic.on{background:var(--bad);border-color:var(--bad);color:var(--ink);animation:pulse 1.2s ease-in-out infinite}
#micNote:empty{display:none}
.mystery.steal{background:repeating-linear-gradient(135deg,var(--gold) 0 12px,#a8e021 12px 24px);color:var(--ink)}
.ghostcard{outline:3px dashed var(--ok);outline-offset:2px;opacity:.95}
.wrongslot{border:2px dashed var(--bad);color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:700;text-align:center}
.votes button{flex:1 1 120px}
.votecount{font-size:.85rem}
.checkres{font-family:var(--display);font-weight:800;font-size:1.25rem;text-align:center;padding:14px;border-radius:16px;border:1.5px solid}
.checkres.ok{color:var(--ok);border-color:var(--ok)}
.checkres.won{font-size:1.4rem;background:color-mix(in oklab,var(--ok) 14%,transparent);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.checkres.bad{color:var(--bad);border-color:var(--bad)}
.mini{min-height:0;padding:4px 10px;font-size:.8rem}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
body{padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
</style>

  if(g.length<2||!t)return false;
  if(g===t||(g.length>=4&&g.includes(t)))return true;
  if(g.length>=4&&t.includes(g)&&(!half||g.length>=t.length*0.5))return true;
  return 1-lev(g,t)/Math.max(g.length,t.length)>=0.75;
}
function guessTitle(g,t){return close(g,t,true)}
function guessArtist(g,a){
  const parts=String(a).split(/,|&| y | and | ft\.? | feat\.? | featuring | x /i).map(x=>x.trim()).filter(Boolean);
  return close(g,a)||parts.some(x=>close(g,x));
}

// ===== Conexión en vivo (MQTT público, mensaje retenido por sala) =====
function connectRoom(brokerIdx = 0){
  if (!room) return;
  if (!window.mqtt){ conn = "error"; render(); return }
  topic = `${NS}/salas/${room}/estado`;
  conn = "connecting"; render();
  const c = mqtt.connect(BROKERS[brokerIdx], { clientId: "ldt_" + myId + "_" + rid().slice(0,4), clean: true, connectTimeout: 8000, reconnectPeriod: 3000 });
  client = c;
  let ok = false;
  const fail = setTimeout(() => { if (!ok && brokerIdx + 1 < BROKERS.length){ c.end(true); connectRoom(brokerIdx + 1) } }, 9000);
  c.on("connect", () => { ok = true; clearTimeout(fail); conn = "on"; c.subscribe(topic, { qos: 1 }, () => { if (dirty) setTimeout(flush, 1200) }); setTimeout(() => { received = true; render() }, 2500); render() });
  c.on("reconnect", () => { if (ok){ conn = "connecting"; render() } });
  c.on("offline", () => { conn = "connecting"; render() });
  c.on("error", () => {});
  c.on("message", (t, buf) => {
    let d; try { d = JSON.parse(buf.toString()) } catch (e) { return }
    received = true;
    if (!(d.seq > curSeq)) { hostCheck(); return }   // mi propio eco o un estado más antiguo
    curSeq = d.seq; dirty = false;
    st = d.st || null; saveLocal();
    if (myVote && st && st.phase === "reveal" && st.round + ":" + st.cur === myVote.key && typeof me === "number" && !st.voteWon && (st.votes || {})[me] !== myVote.val){
      if (applyVote(me, myVote.val)) setTimeout(commit, 300 + Math.random() * 400);
    }
    if (st && typeof me === "number" && me >= st.players.length) setMe(null);
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!typing) render();
    hostCheck();
  });
}
// Cada cambio lleva una marca de tiempo; si no hay conexión, se envía apenas vuelva
let curSeq = 0, dirty = false;
function saveLocal(){ if (room) ls.set("st:" + room, { st, seq: curSeq }) }
function flush(){
  if (!dirty || !client || conn !== "on") return;
  client.publish(topic, JSON.stringify({ st, by: myId, seq: curSeq }), { qos: 1, retain: true });
  dirty = false;
}
function commit(){
  ls.set("setup", setup);
  curSeq = Math.max(Date.now(), curSeq + 1); dirty = true; saveLocal();
  flush(); render();
  hostCheck();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !client) return;
  if (conn !== "on") { try { client.reconnect() } catch (e) {} }
  else { flush(); hostCheck() }
});

async function accessToken(){

  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body });

async function sp(method, path, body){

  if (!a) throw { msg: "Conecta Spotify de nuevo desde el celular anfitrión." };
  let r;

  for (let k = 0; k < 3; k++){
    try { r = await fetch("https://api.spotify.com/v1" + path, { method, headers: { Authorization: "Bearer " + a, ...(body ? { "Content-Type":"application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined }) }
    catch (e) { r = null }
    if (r && r.status < 500) break;
    if (k < 2) await new Promise(res => setTimeout(res, 700 * (k + 1)));
  }
  if (!r) throw { msg: "No hay conexión con Spotify. Revisa el internet y vuelve a intentar.", code: 0 };
  if (r.status === 204) return null;
  let j = null; try { j = await r.json() } catch (e) {}
  if (!r.ok){
    const reason = j && j.error && (j.error.reason || j.error.message) || "";
    if (r.status === 404 || reason === "NO_ACTIVE_DEVICE") throw { msg: "No hay ningún Spotify abierto. Abre la app de Spotify en el celular del parlante y vuelve a intentar.", code: 404 };
    if (r.status === 403) throw { msg: "Spotify no dejó controlar la música. Revisa que la cuenta sea Premium y que tu usuario esté agregado en la app de Spotify for Developers.", code: 403 };
    if (r.status === 429) throw { msg: "Spotify pidió esperar un momento. Intenta de nuevo en unos segundos." };
    if (r.status >= 500) throw { msg: "Spotify no respondió. Abre la app de Spotify en el celular del parlante, revisa que esté conectado al parlante y vuelve a intentar.", code: r.status };
    throw { msg: "Spotify respondió con un error (" + r.status + ").", code: r.status };
  }
  return j;
}

  const out = [], seen = new Set();

    for (let k = 0; k < 10 && url; k++){

      for (const it of (j && j.items) || []){

// Elige una canción que no haya sonado: ni en esta partida, ni en partidas anteriores (historial en el anfitrión),
// ni que ya esté como carta en la línea de alguien. Si ya sonaron todas, parte de nuevo con las más antiguas.
function pickFresh(tracks){
  const last = ls.get("clipTrack:" + room);
  const played = new Set([...(st.used || []), ...(st.played || [])]);
  const names = new Set(st.players.flatMap(q => q.tl.map(e => norm(e[0]))));
  let pool = tracks.filter(t => !played.has(t.uri) && t.uri !== st.lastUri && (!last || t.uri !== last.uri) && !names.has(norm(t.name)));
  if (!pool.length) pool = tracks.filter(t => !played.has(t.uri) && (!last || t.uri !== last.uri));
  if (!pool.length) pool = tracks.filter(t => !last || t.uri !== last.uri);
  if (!pool.length) pool = tracks;
  const hist = ls.get("heardHist", []);
  const fresh = pool.filter(t => !hist.includes(t.uri));
  if (fresh.length) pool = fresh;
  else { // todas sonaron antes: se eligen entre las que sonaron hace más tiempo
    pool = pool.slice().sort((a, b) => hist.indexOf(a.uri) - hist.indexOf(b.uri)).slice(0, Math.max(1, Math.ceil(pool.length / 4)));
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function markHeard(uri){
  if (!st.played) st.played = [];
  if (!st.played.includes(uri)) st.played.push(uri);
  const hist = ls.get("heardHist", []).filter(u => u !== uri); hist.push(uri);
  ls.set("heardHist", hist.slice(-2000));
}
async function loadPausedAt(dev, t, pos){

    await wait(250);
    await sp("POST", "/me/player/next?device_id=" + dev);
    let ok = false;
    for (let k = 0; k < 8; k++){
      await wait(300);
      const c = await sp("GET", "/me/player/currently-playing");
      if (c && c.item && c.item.uri === t.uri){
        // Si Spotify ya empezó a sonar, se pausa al tiro
        if (c.is_playing) { try { await sp("PUT", "/me/player/pause?device_id=" + dev) } catch (e) {} }
        ok = true; break;

    }
    if (!ok) return false;
    await sp("PUT", "/me/player/seek?position_ms=" + pos + "&device_id=" + dev);

    const from = Math.floor(t.ms * 0.15), to = Math.max(from, Math.floor(t.ms * 0.75) - len * 1000);
    pos = from + Math.floor(Math.random() * (to - from + 1));
  }

  await unduck(dev);

  try { await sp("PUT", "/me/player/pause?device_id=" + dev) } catch (e) {}

  // Para evitarlo: se carga la canción en pausa (cola + siguiente), se mueve al punto y recién ahí se reproduce.

  await sp("PUT", "/me/player/play?device_id=" + dev, { uris: [t.uri, ...rest], position_ms: pos });

      await wait(400);

function timeLeft(){ return st && st.clip && st.clipAt ? st.clipAt + st.clip * 1000 - Date.now() : null }

  if (t){
    const sec = Math.max(0, Math.ceil(left / 1000));
    document.getElementById("timerTxt").textContent = sec > 0 ? sec + " s" : "¡Tiempo!";
    document.getElementById("timerBar").style.width = Math.max(0, Math.min(100, left / (st.clip * 10))) + "%";
    t.classList.toggle("low", sec <= 3);
  }

  // Al acabarse el tiempo, se entrega lo que haya elegido el jugador
  if ((left <= 0 && guessingHere) || (left <= -4000 && isHost)){
    if (guessingHere) st.guess = { t: guessDraft.t.trim().slice(0,80), a: guessDraft.a.trim().slice(0,80) };
    stopMic(); st.timeUp = true; st.phase = "check"; st.robando = null; st.checkAt = Date.now();
    commit(); render(); window.scrollTo({ top:0 });
  }
}, 250);

// ===== Acciones =====
function goRoom(code, host){
  room = code; isHost = host; ls.set("host:" + code, host || null);
  me = ls.get("me:" + code);
  history.replaceState(null, "", selfUrl(code));
  connectRoom(); keepAwake();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, i = +el.dataset.i;
  if (act !== "again") confirmReset = false;
  let shared = true;
  switch (act){
    case "create": { const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for (let k = 0; k < 4; k++) c += abc[Math.floor(Math.random() * abc.length)]; goRoom(c, true); return }
    case "join": { const c = joinDraft.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.length < 3){ document.getElementById("join")?.focus(); return } goRoom(c, false); return }
    case "leave": if (client) client.end(true); client = null; room = null; st = null; received = false; menuOpen = false; conn = "off"; history.replaceState(null, "", selfUrl(null)); render(); return;
    case "copy": { const url = REDIRECT + "?sala=" + room; (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { el.textContent = "Link copiado" }).catch(() => { el.textContent = url }); return }
    case "invite": showInvite = !showInvite; render(); return;
    case "viewTl": viewTl = viewTl === i ? null : i; render(); return;
    case "saveCid": { const v = (document.getElementById("cid")?.value || "").trim(); if (v){ ls.set("spotifyClientId", v); render() } return }
    case "spLogin": spotifyLogin(); return;
    case "add": setup.names.push(""); ls.set("setup", setup); render(); return;
    case "rm": setup.names.splice(i, 1); ls.set("setup", setup); render(); return;
    case "start": if (setup.src === "spotify" && (!clientId() || !tok())){ document.querySelector('[data-act="spLogin"],#cid')?.scrollIntoView({ block:"center" }); return } startGame(); keepAwake(); break;
    case "iam": setMe(el.dataset.i === "todos" ? "todos" : i); render(); return;
    case "iamReset": setMe(null); menuOpen = false; render(); return;
    case "menu": menuOpen = true; showInvite = false; render(); window.scrollTo({ top:0 }); return;
    case "back": menuOpen = false; render(); return;
    case "slot":
      if (st.phase === "turn") st.slot = i;
      else if (st.phase === "steal" && st.robando != null && st.stealer == null && (allHere() || me === st.robando)){
        st.stealer = st.robando; st.sslot = i; st.robando = null; st.stealDoneAt = Date.now();
      } else return;
      break;
    case "confirm": if (st.slot == null) return; stopMic(); st.timeUp = false; st.phase = "check"; st.robando = null; st.checkAt = Date.now(); st.guess = { t: guessDraft.t.trim().slice(0,80), a: guessDraft.a.trim().slice(0,80) }; break;
    case "otra": if (spot()){ request("play"); st.heard = false } break;
    case "noVolOk": ls.set("noVolume", null); st.after = "none"; break;
    case "mic": startMic(el.dataset.f); return;
    case "play": if (spot() && st.phase === "turn" && !st.req){ request("play"); st.heard = false } else return; break;
    case "buy": if (st.phase !== "turn" || st.req || st.players[st.cur].tk < 3) return;
      if (spot()) request("buy"); else { const n = st.deck.pop(); const e = n != null ? card(n) : buyFromList(); if (!e || !grantCard(e)) return }
      break;
    case "skip": st.players[st.cur].tk--; st.slot = null; st.heard = false;
      if (spot()) request("play"); else { const n = st.deck.pop(); if (n == null) st.phase = "win"; else st.song = card(n) }
      break;
    case "pickStealer": if (st.phase === "steal" && !st.checkOk && revealWait() > 0 && st.robando == null && st.stealer == null && st.players[i] && st.players[i].tk > 0 && i !== st.cur){ st.robando = i; st.players[i].tk--; st.robAt = Date.now() } else return; break;
    case "check": if (st.phase !== "check" || st.req || !checkOwner()) return; if (spot()) request("check"); else doCheck(); break;
    case "reveal": if (!canReveal()) return; if (!doReveal()) return; break;
    case "cancelReq": st.req = null; handledReq = null; hostBusy = false; break;
    case "forceReveal": request(st.phase === "check" ? "check" : "reveal", { force: true }); break;
    case "setYear": { const y = parseInt(yearDraft, 10); if (!(y >= 1900 && y <= 2100)){ document.getElementById("yearIn")?.focus(); return }
      const [t,a] = st.pending; st.pending = null; st.song = [t, a, y, "manual"]; if (st.fromCheck) doCheck(); else reveal(); break }
    case "fixYear": yearDraft = String(st.song[2]); st.pending = [st.song[0], st.song[1]]; undoReveal(); st.phase = "needyear"; break;
    case "vote": { if (typeof me !== "number") return; const val = el.dataset.v === "1";
      if (!applyVote(me, val)) return; myVote = { key: st.round + ":" + st.cur, val }; break }
    case "voteAll": { if (!allHere() || st.voteWon || !voteInfo().eligible) return; st.voteWon = true; st.bonus = true; const p = st.players[st.cur]; p.tk = Math.min(5, p.tk + 1); break }
    case "next": if (st.phase === "reveal" && nextOwner()) nextTurn(); else return; break;
    case "end": st.phase = "win"; menuOpen = false; break;
    case "again": if (!confirmReset){ confirmReset = true; render(); return } confirmReset = false; st = null; menuOpen = false; break;
    case "again2": st = null; break;
    default: return;
  }
  if (shared) commit();
  render(); window.scrollTo({ top:0 });
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset.act;
  if (a === "name"){ setup.names[+el.dataset.i] = el.value; ls.set("setup", setup); const b = document.querySelector('[data-act="start"]'); if (b) b.disabled = setup.names.filter(n => n.trim()).length < 2 }
  if (a === "playlist"){ setup.playlist = el.value; ls.set("setup", setup) }
  if (a === "year") yearDraft = el.value.replace(/\D/g, "");
  if (a === "joinIn") joinDraft = el.value;
  if (a === "gTitle") guessDraft.t = el.value;
  if (a === "gArtist") guessDraft.a = el.value;
});
document.addEventListener("change", e => {
  const a = e.target.dataset.act;
  if (a === "target") setup.target = +e.target.value;
  if (a === "tokens") setup.tokens = +e.target.value;
  if (a === "filter") setup.filter = e.target.value;
  if (a === "part"){ setup.part = e.target.value; ls.set("setup", setup); render(); return }
  if (a === "after"){ setup.after = e.target.value; ls.set("setup", setup); render(); return }
  if (a === "clip"){ setup.clip = +e.target.value; ls.set("setup", setup); render(); return }
  if (a === "src"){ setup.src = e.target.value; ls.set("setup", setup); render(); return }
  ls.set("setup", setup);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "join") document.querySelector('[data-act="join"]')?.click() });

// Para la página de pruebas
window.__ldt = { room: () => room, host: () => isHost, phase: () => st && st.phase, cur: () => st ? st.cur : null, conn: () => conn };

// ===== Inicio =====
(async () => {
  if (await spotifyCallback() === "away") return;
  if (room){ isHost = !!ls.get("host:" + room); me = ls.get("me:" + room);
    const saved = ls.get("st:" + room);
    if (saved && saved.seq){ st = saved.st; curSeq = saved.seq; received = true; dirty = isHost } }
  const err = ls.get("spotifyError"); if (err){ ls.set("spotifyError", null); setTimeout(() => alert("Spotify: " + err), 300) }
  render();
  if (room){ connectRoom(); keepAwake() }
})();

</script>
